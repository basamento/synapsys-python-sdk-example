[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synapsys-python-sdk-example"
version = "0.1.0"
description = "Vanilla Python example application for basamento-synapsys"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "basamento-synapsys>=0.1.0,<0.2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
synapsys-python-example = "synapsys_python_example.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src"]
